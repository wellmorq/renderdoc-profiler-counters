<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RenderDoc performance report</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1020;
            --surface: #121a2d;
            --surface-2: #182238;
            --surface-3: #202c45;
            --text: #edf2ff;
            --muted: #94a3bd;
            --border: #2a3855;
            --accent: #78a9ff;
            --accent-soft: rgba(120, 169, 255, .14);
            --good: #61d6a3;
            --bad: #ff7d90;
            --higher: #f0a44b;
            --lower: #55a7e8;
            --warn: #f4c76b;
            --shadow: 0 20px 55px rgba(0, 0, 0, .28);
        }
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #eef2f8;
            --surface: #ffffff;
            --surface-2: #f6f8fc;
            --surface-3: #e9eef7;
            --text: #172033;
            --muted: #5f6d85;
            --border: #d5ddea;
            --accent: #315fba;
            --accent-soft: rgba(49, 95, 186, .1);
            --good: #167a55;
            --bad: #b72845;
            --higher: #a85d08;
            --lower: #176da8;
            --warn: #8d6414;
            --shadow: 0 18px 45px rgba(41, 55, 85, .12);
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        button, input, select { font: inherit; }
        button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .app-header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; min-height: 60px; padding: 9px 24px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(18px); }
        .frame-summary { display: flex; align-items: baseline; gap: 9px; min-width: 210px; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .frame-caption { color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
        .frame-value { font-size: 22px; font-weight: 740; }
        .frame-arrow { color: var(--muted); font-size: 14px; }
        .frame-delta { font-size: 12px; font-weight: 700; }
        .frame-delta.good { color: var(--good); }
        .frame-delta.bad { color: var(--bad); }
        .mode-tabs { display: flex; gap: 6px; flex: 1; }
        .mode-tabs[hidden] { display: none; }
        .mode-tab, .icon-btn, .sort-select { border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--muted); }
        .mode-tab { padding: 7px 12px; cursor: pointer; text-transform: capitalize; }
        .mode-tab:hover { color: var(--text); border-color: var(--accent); }
        .mode-tab.active { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
        .icon-btn { width: 38px; height: 38px; cursor: pointer; color: var(--text); }
        .header-actions { position: relative; display: flex; align-items: center; gap: 8px; margin-left: auto; }
        .page { width: min(1680px, 100%); margin: 0 auto; padding: 14px 24px 32px; }
        .toolbar { display: flex; align-items: center; gap: 10px; padding: 11px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
        .search-wrap { position: relative; flex: 1; }
        .search { width: 100%; height: 38px; padding: 0 38px 0 38px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2); color: var(--text); }
        .search-wrap::before { content: "⌕"; position: absolute; left: 13px; top: 7px; color: var(--muted); font-size: 19px; }
        .clear-search { position: absolute; right: 7px; top: 5px; width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; }
        .clear-search:hover { background: var(--surface-3); color: var(--text); }
        .sort-select { height: 38px; padding: 0 10px; cursor: pointer; }
        .result-count { min-width: 62px; text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
        .result-count[hidden] { display: none; }
        .workspace { display: grid; grid-template-columns: minmax(620px, 1.5fr) minmax(360px, .8fr); gap: 12px; min-height: 620px; }
        .panel { min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
        .panel-title { display: flex; justify-content: space-between; align-items: center; min-height: 45px; padding: 0 14px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; }
        .event-list { height: 68vh; min-height: 540px; overflow: auto; }
        .event-head, .event-row { display: grid; grid-template-columns: minmax(260px, 1fr) 105px 105px 68px; align-items: center; gap: 10px; }
        .event-head { position: sticky; top: 0; z-index: 4; min-height: 34px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
        .event-row { position: relative; width: 100%; min-height: 35px; padding: 0 12px; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent); background: transparent; color: var(--text); text-align: left; cursor: pointer; }
        .event-row:hover { background: var(--accent-soft); }
        .event-row.selected { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
        .event-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: calc(var(--depth) * 14px); }
        .event-name strong { font-weight: 600; }
        .event-path-hint { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; overflow: hidden; text-overflow: ellipsis; }
        .metric-cell { font-variant-numeric: tabular-nums; text-align: right; }
        .duration-cell { display: grid; grid-template-columns: minmax(34px, auto) 44px; align-items: center; gap: 7px; }
        .duration-bar { height: 5px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
        .duration-bar > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
        .delta.good { color: var(--good); }
        .delta.bad { color: var(--bad); }
        .empty { display: grid; place-items: center; min-height: 280px; color: var(--muted); text-align: center; padding: 40px; }
        .detail { height: 68vh; min-height: 540px; overflow: auto; }
        .detail-hero { padding: 11px 13px; border-bottom: 1px solid var(--border); background: linear-gradient(145deg, var(--surface-2), var(--surface)); }
        .detail-name { font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
        .detail-path { margin-top: 4px; color: var(--muted); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .chip { padding: 3px 6px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--muted); font-size: 9px; }
        .chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); }
        .chip.new { color: #c1a9ff; border-color: #7e65bd; }
        .chip.estimate { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
        .metric-filter { width: calc(100% - 24px); height: 34px; margin: 12px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text); }
        .metrics { padding: 0 12px 12px; }
        .metric { position: relative; padding: 10px 4px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
        .metric-top { display: grid; grid-template-columns: minmax(160px, 1fr) auto auto; gap: 10px; align-items: start; }
        .metric-name { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
        .metric-value { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; }
        .metric-actions { display: flex; align-items: center; gap: 5px; min-width: 18px; }
        .metric-flag { display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--border); border-radius: 50%; color: var(--muted); font-size: 10px; font-weight: 750; }
        .metric-flag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); }
        .metric-flag.estimate { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
        .metric-compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin-top: 7px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
        .metric-before { text-align: right; }
        .metric-after { text-align: left; }
        .metric-insight > summary { display: grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--border); border-radius: 50%; color: var(--muted); font-size: 10px; font-weight: 750; cursor: pointer; list-style: none; }
        .metric-insight > summary::-webkit-details-marker { display: none; }
        .metric-insight[open] > summary { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
        .metric-insight { position: relative; }
        .metric-insight-body { position: absolute; top: 23px; right: 0; z-index: 8; width: min(360px, calc(100vw - 72px)); padding: 9px 10px; border: 1px solid var(--border); border-left: 2px solid var(--accent); border-radius: 7px; background: var(--surface-2); box-shadow: var(--shadow); color: var(--muted); font-size: 10px; line-height: 1.45; }
        .metric-insight-body strong { color: var(--text); }
        .metric-range-visual { position: relative; height: 8px; margin-top: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
        .metric-range-visual > span { position: absolute; top: 0; width: 3px; height: 100%; border-radius: 99px; background: var(--accent); transform: translateX(-50%); }
        .timeline-panel { margin-bottom: 12px; }
        .timeline-header { justify-content: flex-end; min-height: 41px; }
        .timeline-controls { display: flex; align-items: center; gap: 8px; }
        .timeline-field { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .timeline-field select { max-width: 360px; height: 30px; padding: 0 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2); color: var(--text); }
        .zoom-btn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2); color: var(--text); cursor: pointer; }
        .zoom-range { width: 90px; accent-color: var(--accent); }
        .zoom-value { width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
        .timeline-scroll { height: 48vh; min-height: 350px; max-height: 700px; overflow: auto; background: var(--surface-2); }
        .timeline-grid { position: relative; min-width: 980px; min-height: 100%; overflow: hidden; background-image: linear-gradient(to right, color-mix(in srgb, var(--border) 45%, transparent) 1px, transparent 1px); background-size: 10% 100%; }
        .depth-line { position: absolute; left: 0; right: 0; height: 1px; background: color-mix(in srgb, var(--border) 62%, transparent); pointer-events: none; }
        .timeline-block { position: absolute; display: flex; align-items: center; gap: 4px; min-width: 2px; height: 25px; padding: 0 7px; overflow: hidden; border: 1px solid rgba(255,255,255,.18); border-radius: 5px; color: #fff; box-shadow: 0 2px 7px rgba(0,0,0,.2); text-align: left; cursor: pointer; transition: filter .12s ease, opacity .12s ease, box-shadow .12s ease; }
        .timeline-block:hover { z-index: 5; filter: brightness(1.16); }
        .timeline-block.selected { z-index: 6; box-shadow: 0 0 0 2px var(--accent), 0 5px 16px rgba(0,0,0,.35); }
        .timeline-block.dim { opacity: .13; filter: saturate(.3); }
        .timeline-block.match { z-index: 7; box-shadow: 0 0 0 2px var(--warn); }
        .timeline-block.unmeasured { background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgba(255,255,255,.16) 5px 8px); }
        .timeline-block.zero { width: 3px !important; padding: 0; border-style: dashed; border-color: var(--muted); background: transparent !important; box-shadow: none; }
        .timeline-block.unmeasured.empty-width { width: 3px !important; padding: 0; border-color: #94a3b8; background-color: #64748b !important; background-image: repeating-linear-gradient(135deg, transparent 0 3px, rgba(255,255,255,.35) 3px 5px) !important; box-shadow: none; }
        .timeline-block .caret { flex: 0 0 auto; font-size: 9px; opacity: .85; }
        .timeline-block .timeline-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; font-weight: 620; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
        .timeline-footer { display: flex; align-items: center; justify-content: flex-end; min-height: 34px; padding: 7px 13px; border-top: 1px solid var(--border); color: var(--muted); font-size: 10px; }
        .timeline-footer[hidden] { display: none; }
        .timeline-legend { display: flex; gap: 8px; }
        .legend-dot { display: inline-block; width: 11px; height: 11px; border-radius: 3px; background: #64748b; }
        .legend-dot.higher { background: var(--higher); }
        .legend-dot.lower { background: var(--lower); }
        .legend-dot.new { background: #9b72e8; }
        .legend-dot.unmeasured { background: repeating-linear-gradient(135deg, #64748b 0 4px, #94a3b8 4px 6px); }
        .empty-symbol { font-size: 42px; opacity: .45; }
        @media (max-width: 1100px) {
            .workspace { grid-template-columns: 1fr; }
            .event-list, .detail { height: auto; min-height: 460px; max-height: 70vh; }
        }
        @media (max-width: 720px) {
            .app-header { flex-wrap: wrap; padding: 10px 14px; }
            .frame-summary { min-width: 0; flex: 1; gap: 6px; }
            .frame-summary.compare .frame-caption { display: none; }
            .frame-summary.compare .frame-value { font-size: 18px; }
            .frame-summary.compare .frame-delta { font-size: 10px; }
            .mode-tabs { order: 3; flex-basis: 100%; overflow-x: auto; }
            .page { padding: 14px; }
            .toolbar { flex-wrap: wrap; }
            .search-wrap { flex-basis: 100%; }
            .timeline-controls { flex-wrap: wrap; justify-content: flex-end; }
            .timeline-field select { max-width: 210px; }
            .event-head, .event-row { grid-template-columns: minmax(130px, 1fr) 72px 52px; gap: 6px; padding-inline: 8px; }
            .event-head.single > :nth-child(4), .event-row.single > :nth-child(4) { display: none; }
            .event-head.compare > :nth-child(3), .event-row.compare > :nth-child(3) { display: none; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="frame-summary" id="frame-summary" aria-label="GPU frame time"></div>
        <nav class="mode-tabs" id="mode-tabs" aria-label="Report mode"></nav>
        <div class="header-actions">
            <button class="icon-btn" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">◐</button>
        </div>
    </header>
    <main class="page">
        <section class="toolbar" aria-label="Event controls">
            <div class="search-wrap">
                <input class="search" id="search" type="search" autocomplete="off" placeholder="Search…">
                <button class="clear-search" id="clear-search" type="button" aria-label="Clear search">×</button>
            </div>
            <select class="sort-select" id="sort" aria-label="Sort events">
                <option value="timeline">Timeline order</option>
                <option value="duration">GPU duration</option>
                <option value="regression">Largest regression</option>
            </select>
            <div class="result-count" id="result-count"></div>
        </section>
        <section class="panel timeline-panel">
            <div class="panel-title timeline-header">
                <div class="timeline-controls">
                    <label class="timeline-field"><select id="width-metric" aria-label="Timeline width metric" title="Timeline block width"></select></label>
                    <button class="zoom-btn" id="zoom-out" type="button" aria-label="Zoom out">−</button>
                    <input class="zoom-range" id="zoom" type="range" min="1" max="6" step="0.25" value="1" aria-label="Timeline zoom">
                    <button class="zoom-btn" id="zoom-in" type="button" aria-label="Zoom in">+</button>
                    <span class="zoom-value" id="zoom-value">100%</span>
                </div>
            </div>
            <div class="timeline-scroll" id="timeline-scroll"><div class="timeline-grid" id="timeline-grid"></div></div>
            <div class="timeline-footer" id="timeline-footer" hidden>
                <span class="timeline-legend" id="timeline-legend">
                    <span class="legend-dot higher" role="img" aria-label="Higher after" title="Higher after"></span>
                    <span class="legend-dot lower" role="img" aria-label="Lower after" title="Lower after"></span>
                    <span class="legend-dot new" role="img" aria-label="No measured baseline" title="No measured baseline"></span>
                    <span class="legend-dot unmeasured" role="img" aria-label="Unavailable after" title="Unavailable after"></span>
                </span>
            </div>
        </section>
        <section class="workspace">
            <div class="panel">
                <div class="event-list" id="event-list"></div>
            </div>
            <aside class="panel detail" id="detail"></aside>
        </section>
    </main>
    <script>
        'use strict';
        const report = __REPORT_DATA__;
        const EXPECTED_SCHEMA_VERSION = 3;
        const EXPECTED_METRICS_ENCODING = 'sparse-zero-omitted';
        const SUPPORTED_COUNTER_KINDS = new Set(['sum', 'max', 'min', 'mean', 'unknown']);
        const durationScaleToMs = header => {
            const match = String(header || '').trim().match(/^(?:GPU )?Duration\s*\((s|ms|us|µs|μs|ns)\)$/i);
            if (!match) return null;
            const unit = match[1].toLowerCase().replace(/[µμ]/g, 'u');
            return unit === 's' ? 1000 : unit === 'ms' ? 1 : unit === 'us' ? 0.001 : unit === 'ns' ? 0.000001 : null;
        };
        const recordProvenanceIsValid = (record, capture) => {
            if (!record || typeof record !== 'object' || Array.isArray(record)) return false;
            if (!Number.isInteger(record.eid) || record.eid < 0 || typeof record.stableKey !== 'string' || !record.stableKey || typeof record.name !== 'string' || typeof record.path !== 'string') return false;
            if (record.parentKey !== null && typeof record.parentKey !== 'string') return false;
            if (!Number.isInteger(record.depth) || record.depth < 0 || !Number.isInteger(record.order) || record.order < 0 || !Number.isInteger(record.childCount) || record.childCount < 0) return false;
            if (record.scope !== (record.childCount ? 'descendants' : 'self')) return false;
            if (!Number.isInteger(record.counterRowCount) || record.counterRowCount < 0 || !record.metrics || typeof record.metrics !== 'object' || Array.isArray(record.metrics) || !record.aggregation || record.aggregation.rowCount !== record.counterRowCount) return false;
            const metricEntries = Object.entries(record.metrics);
            if (metricEntries.some(([header, value]) => !capture.headers.includes(header) || (value !== null && !Number.isFinite(value)))) return false;
            if (record.counterRowCount === 0) return metricEntries.length === 0 && record.aggregation.source === 'unavailable' && record.aggregation.method === 'unavailable-no-rows' && record.aggregation.methods === undefined;
            if (Object.prototype.hasOwnProperty.call(record.metrics, capture.durationHeader)) {
                const duration = record.metrics[capture.durationHeader];
                if (!Number.isFinite(duration) || duration < 0) return false;
            }
            if (record.selfMetrics !== undefined) {
                if (!record.selfMetrics || typeof record.selfMetrics !== 'object' || Array.isArray(record.selfMetrics)) return false;
                if (Object.entries(record.selfMetrics).some(([header, value]) => !capture.headers.includes(header) || !Number.isFinite(value) || (header === capture.durationHeader && value < 0))) return false;
            }
            if (record.scope === 'self') return record.counterRowCount === 1 && record.aggregation.source === 'self-row' && record.aggregation.method === 'raw-self' && record.aggregation.methods === undefined;
            return record.scope === 'descendants'
                && record.aggregation.source === 'descendant-rows'
                && record.aggregation.method === undefined
                && record.aggregation.methods && typeof record.aggregation.methods === 'object' && !Array.isArray(record.aggregation.methods)
                && capture.headers.every(header => Object.prototype.hasOwnProperty.call(record.aggregation.methods, header));
        };
        const captureSummaryIsValid = capture => {
            const summary = capture.summary;
            return summary && typeof summary === 'object' && !Array.isArray(summary)
                && Number.isInteger(summary.eventCount) && summary.eventCount === capture.records.length
                && Number.isInteger(summary.rootCount) && summary.rootCount >= 1
                && Number.isInteger(summary.measuredRootCount) && summary.measuredRootCount >= 0
                && Number.isInteger(summary.unmeasuredRootCount) && summary.unmeasuredRootCount >= 0
                && summary.measuredRootCount + summary.unmeasuredRootCount === summary.rootCount
                && Number.isInteger(summary.counterRowCount) && summary.counterRowCount >= 0
                && Number.isInteger(summary.metricCount) && summary.metricCount === capture.headers.length
                && Number.isInteger(summary.missingLeafCount) && summary.missingLeafCount >= 0
                && (summary.measuredRootCount === 0
                    ? summary.totalDurationMs === null
                    : Number.isFinite(summary.totalDurationMs) && summary.totalDurationMs >= 0);
        };
        const captureTopologyIsValid = capture => {
            const recordsByKey = new Map(capture.records.map(record => [record.stableKey, record]));
            const actualChildCounts = new Map(capture.records.map(record => [record.stableKey, 0]));
            const roots = [];
            for (const record of capture.records) {
                if (record.parentKey === null) {
                    if (record.depth !== 0) return false;
                    roots.push(record);
                    continue;
                }
                const parent = recordsByKey.get(record.parentKey);
                if (!parent || parent.depth !== record.depth - 1) return false;
                actualChildCounts.set(record.parentKey, actualChildCounts.get(record.parentKey) + 1);
            }
            if (capture.records.some(record => actualChildCounts.get(record.stableKey) !== record.childCount)) return false;
            const measuredRoots = roots.filter(record => record.counterRowCount > 0);
            const missingLeaves = capture.records.filter(record => record.childCount === 0 && record.counterRowCount === 0).length;
            if (capture.summary.rootCount !== roots.length
                || capture.summary.measuredRootCount !== measuredRoots.length
                || capture.summary.unmeasuredRootCount !== roots.length - measuredRoots.length
                || capture.summary.missingLeafCount !== missingLeaves) return false;
            if (!measuredRoots.length) return capture.summary.totalDurationMs === null;
            const totalDurationMs = measuredRoots.reduce((sum, record) => sum + (record.metrics[capture.durationHeader] ?? 0), 0) * capture.durationToMs;
            const tolerance = Math.max(1e-9, Math.abs(totalDurationMs) * 1e-12);
            return Math.abs(totalDurationMs - capture.summary.totalDurationMs) <= tolerance;
        };
        const comparisonIsValid = (comparison, captures) => {
            if (captures.length === 1) return comparison === null;
            if (!comparison || typeof comparison !== 'object' || Array.isArray(comparison) || !Array.isArray(comparison.labels) || !Array.isArray(comparison.matches)) return false;
            if (comparison.labels.length !== 2 || comparison.labels.some((label, index) => label !== captures[index].label)) return false;
            if (!Number.isInteger(comparison.matchedCount) || comparison.matchedCount !== comparison.matches.length || !Number.isInteger(comparison.onlyFirstCount) || comparison.onlyFirstCount < 0 || !Number.isInteger(comparison.onlySecondCount) || comparison.onlySecondCount < 0) return false;
            if (comparison.matchedCount + comparison.onlyFirstCount !== captures[0].records.length || comparison.matchedCount + comparison.onlySecondCount !== captures[1].records.length) return false;
            const firstIndices = new Set();
            const secondIndices = new Set();
            const validPairs = comparison.matches.every(pair => {

            value.textContent = text;

        function renderList() {

            const shown = rows.slice(0, MAX_ROWS);

            shown.forEach(row => {

                const rowKey = record.stableKey;
                if (state.selectedKey === rowKey) button.classList.add('selected');
                const name = document.createElement('span');
                name.className = 'event-name';
                const strong = document.createElement('strong');
                strong.textContent = record.name;
                name.appendChild(strong);
                if (state.query || state.sort !== 'timeline') {
                    const pathHint = document.createElement('span');
                    pathHint.className = 'event-path-hint';
                    pathHint.textContent = record.path;
                    name.appendChild(pathHint);
                }
                button.appendChild(name);
                const value = state.mode === 'compare' ? row.afterDuration : duration(row, report.captures[Number(state.mode)]);
                button.appendChild(durationCell(value, maxDuration));
                if (state.mode === 'compare') {
                    button.appendChild(cell('metric-cell', format(row.beforeDuration)));
                    const delta = cell(`metric-cell delta ${row.delta > 0 ? 'bad' : row.delta < 0 ? 'good' : ''}`, row.relative === null ? format(row.delta) : `${row.relative >= 0 ? '+' : ''}${(row.relative * 100).toFixed(1)}%`);
                    button.appendChild(delta);
                } else {
                    const share = Number.isFinite(frame.value) && frame.value > 0 && Number.isFinite(value) ? value / frame.value : null;
                    const shareCell = cell('metric-cell', share === null ? '∅' : `${frame.complete ? '' : '≤'}${(share * 100).toFixed(1)}%`);
                    if (share !== null && !frame.complete) shareCell.title = 'Upper bound because the frame total is incomplete';
                    button.appendChild(shareCell);
                    button.appendChild(cell('metric-cell', String(row.eid)));
                }
                button.onclick = () => { state.selected = row; state.selectedKey = rowKey; state.metricQuery = ''; renderTimeline(); renderList(); renderDetail(row); };
                els['event-list'].appendChild(button);
            });
        }

        function metricValue(header, value) {
            const formatted = format(value, 4);
            return /\(%\)|\.pct\b/i.test(header) && Number.isFinite(value) ? `${formatted}%` : formatted;
        }

        function metricFlag(text, title, className = '') {
            const flag = document.createElement('span');
            flag.className = `metric-flag ${className}`.trim();
            flag.textContent = text;
            flag.title = title;
            flag.setAttribute('aria-label', title);
            return flag;
        }

        function descendantRange(record, capture, header) {
            if (record.scope === 'self') return null;
            const prefix = `${record.stableKey}/`;
            let count = 0;
            let min = Infinity;
            let max = -Infinity;
            capture.records.forEach(candidate => {
                if (candidate.scope !== 'self' || candidate.counterRowCount === 0 || !candidate.stableKey.startsWith(prefix)) return;
                const value = metric(candidate, capture, header);
                if (!Number.isFinite(value)) return;
                count++;
                min = Math.min(min, value);
                max = Math.max(max, value);
            });
            return count ? { count, min, max } : null;
        }

        function aggregationMethod(record, capture, header) {
            const sourceHeader = header === NORMALIZED_DURATION ? capture.durationHeader : header;
            if (!sourceHeader || !record || record.counterRowCount === 0) return null;
            return record.aggregation.method !== undefined
                ? record.aggregation.method
                : record.aggregation.methods[sourceHeader];
        }

        function renderMetricMetadata(container, actions, record, capture, header, value) {
            const sourceHeader = header === NORMALIZED_DURATION ? capture.durationHeader : header;
            const method = aggregationMethod(record, capture, header);
            const estimated = typeof method === 'string' && method.startsWith('duration-weighted');
            if (estimated) {
                actions.appendChild(metricFlag('≈', `${method}; derived from ${record.counterRowCount} measured descendant rows`, 'estimate'));
                const range = descendantRange(record, capture, sourceHeader);
                if (range && Number.isFinite(value)) {
                    const span = range.max - range.min;
                    const position = span > 0 ? Math.max(0, Math.min(100, (value - range.min) / span * 100)) : 50;
                    const visual = document.createElement('div');
                    visual.className = 'metric-range-visual';
                    visual.title = `${metricValue(sourceHeader, range.min)} — ${metricValue(sourceHeader, range.max)} · ${range.count}`;
                    const marker = document.createElement('span');
                    marker.style.left = `${position}%`;
                    visual.appendChild(marker);
                    container.appendChild(visual);
                }
            } else if (typeof method === 'string' && method.startsWith('unavailable')) {
                actions.appendChild(metricFlag('∅', method.replaceAll('-', ' '), 'warn'));
            }

            const anomaly = sourceHeader ? capture.anomalies.find(entry => entry.header === sourceHeader) : null;
            if (anomaly) {
                actions.appendChild(metricFlag('!', `${anomaly.count} raw values outside the expected percentage range: ${format(anomaly.min, 4)} — ${format(anomaly.max, 4)}. Raw values are unchanged.`, 'warn'));
            }

            const doc = sourceHeader ? report.metricDocs[sourceHeader] : null;
            if (!doc) return;
            const insight = document.createElement('details');
            insight.className = 'metric-insight';
            const summary = document.createElement('summary');
            summary.textContent = 'i';
            summary.title = doc.label;
            summary.setAttribute('aria-label', `Open guidance for ${sourceHeader}`);
            const body = document.createElement('div');
            body.className = 'metric-insight-body';
            const title = document.createElement('strong');
            title.textContent = doc.label;
            body.append(title, document.createElement('br'), document.createTextNode(doc.plain));
            if (doc.doesNotProve) body.append(document.createElement('br'), document.createTextNode(`Does not prove: ${doc.doesNotProve}`));
            insight.append(summary, body);
            actions.appendChild(insight);
        }

        function appendChip(container, text, title = '', className = '') {
            const chip = document.createElement('span');
            chip.className = `chip ${className}`.trim();
            chip.textContent = text;
            if (title) chip.title = title;
            container.appendChild(chip);
        }

        function detailHero(record, compareRecord = null, capture = activeCapture()) {
            const hero = document.createElement('div');
            hero.className = 'detail-hero';
            const title = document.createElement('div');
            title.className = 'detail-name';
            title.textContent = record.name;
            const path = document.createElement('div');
            path.className = 'detail-path';
            path.textContent = record.path;
            path.title = `${record.path}\nEID ${record.eid}`;
            const chips = document.createElement('div');
            chips.className = 'chips';
            if (record.counterRowCount === 0) appendChip(chips, '∅', `${capture.label}: no counter row; values are unavailable, not measured zeros`, 'warn');
            if (compareRecord?.counterRowCount === 0) appendChip(chips, 'BASE ∅', `${report.captures[0].label}: no counter row; baseline values are unavailable`, 'warn');
            if (state.mode === 'compare' && !compareRecord) appendChip(chips, 'NEW', `No stable-path match in ${report.captures[0].label}`, 'new');
            if (record.scope !== 'self' && record.counterRowCount > 0) appendChip(chips, `Σ ${record.counterRowCount}`, 'Derived from measured descendant rows; each metric uses its declared sum, extrema, weighted-mean, or unavailable method', 'estimate');
            const shares = state.widthMetric ? recordShares(record, capture, state.widthMetric) : null;
            if (shares) {
                appendChip(chips, format(shares.value, 4), metricLabel(state.widthMetric));
                if (shares.parent !== null) appendChip(chips, `${(shares.parent * 100).toFixed(1)}% ↑`, 'Share of parent');
                if (shares.capture !== null) appendChip(chips, `${(shares.capture * 100).toFixed(1)}% Σ`, 'Share of capture');
            }
            hero.append(title, path, chips);
            return hero;
        }

        function renderDetail(row) {
            els.detail.replaceChildren();
            const compare = state.mode === 'compare';
            const record = compare ? row.after : row;
            const before = compare ? row.before : null;
            const capture = activeCapture();
            const beforeCapture = report.captures[0];
            els.detail.appendChild(detailHero(record, before, capture));
            const filter = document.createElement('input');
            filter.className = 'metric-filter';
            filter.type = 'search';
            filter.placeholder = 'Filter…';
            filter.value = state.metricQuery;
            els.detail.appendChild(filter);
            const metrics = document.createElement('div');
            metrics.className = 'metrics';
            els.detail.appendChild(metrics);

            const renderMetrics = () => {
                state.metricQuery = filter.value.toLowerCase();
                metrics.replaceChildren();
                let headers = compare
                    ? Array.from(new Set([...beforeCapture.headers, ...capture.headers]))
                    : capture.headers.slice();
                if (compare && beforeCapture.durationHeader && capture.durationHeader) {
                    headers = [NORMALIZED_DURATION, ...headers.filter(header => header !== beforeCapture.durationHeader && header !== capture.durationHeader)];
                }
                headers = headers.filter(header => !state.metricQuery || metricLabel(header).toLowerCase().includes(state.metricQuery));
                const durationHeader = compare ? NORMALIZED_DURATION : capture.durationHeader;
                headers.sort((a, b) => a === durationHeader ? -1 : b === durationHeader ? 1 : a.localeCompare(b));
                headers.forEach(header => {
                    const item = document.createElement('div');
                    item.className = 'metric';
                    const top = document.createElement('div');
                    top.className = 'metric-top';
                    top.appendChild(cell('metric-name', metricLabel(header)));
                    const afterValue = metric(record, capture, header);
                    const actions = document.createElement('span');
                    actions.className = 'metric-actions';
                    if (compare) {
                        const beforeValue = metric(before, beforeCapture, header);
                        const display = changeDisplay(beforeValue, afterValue);
                        const change = cell(`metric-value delta ${display.tone}`, display.text);
                        if (display.title) change.title = display.title;
                        top.append(change, actions);
                        item.appendChild(top);
                        const values = document.createElement('div');
                        values.className = 'metric-compare';
                        values.title = `${beforeCapture.label} → ${capture.label}`;
                        values.appendChild(cell('metric-before', metricValue(header, beforeValue)));
                        values.appendChild(cell('frame-arrow', '→'));
                        values.appendChild(cell('metric-after', metricValue(header, afterValue)));
                        item.appendChild(values);
                    } else {
                        top.append(cell('metric-value', metricValue(header, afterValue)), actions);
                        item.appendChild(top);
                    }
                    renderMetricMetadata(item, actions, record, capture, header, afterValue);
                    metrics.appendChild(item);
                });
                if (!headers.length) {
                    const empty = document.createElement('div');
                    empty.className = 'empty';
                    empty.setAttribute('aria-label', 'No matching counters');
                    const symbol = document.createElement('span');
                    symbol.className = 'empty-symbol';
                    symbol.setAttribute('aria-hidden', 'true');
                    symbol.textContent = '∅';
                    empty.appendChild(symbol);
                    metrics.appendChild(empty);
                }
            };
            filter.oninput = renderMetrics;
            renderMetrics();
        }

        function render() {
            Array.from(els['mode-tabs'].children).forEach(button => button.classList.toggle('active', button.dataset.mode === state.mode));
            els.sort.querySelector('[value="regression"]').disabled = state.mode !== 'compare';
            renderFrameSummary();
            renderTimeline();
            renderList();
            if (state.selected) renderDetail(state.selected);
            else els.detail.replaceChildren();
        }

        function setZoom(value) {
            state.zoom = Math.min(6, Math.max(1, Number(value) || 1));
            els.zoom.value = String(state.zoom);
            els['zoom-value'].textContent = `${Math.round(state.zoom * 100)}%`;
            renderTimeline();
        }

        els.search.oninput = () => { state.query = els.search.value; state.selected = null; state.selectedKey = null; state.collapsed.clear(); render(); };
        els['clear-search'].onclick = () => { els.search.value = ''; state.query = ''; state.selected = null; state.selectedKey = null; state.collapsed.clear(); render(); els.search.focus(); };
        els.sort.onchange = () => { state.sort = els.sort.value; state.selected = null; state.selectedKey = null; render(); };
        els['width-metric'].onchange = () => {
            state.widthMetric = els['width-metric'].value;
            renderTimeline();
            renderList();
            if (state.selected) renderDetail(state.selected);
        };
        els.zoom.oninput = () => setZoom(els.zoom.value);
        els['zoom-out'].onclick = () => setZoom(state.zoom - .25);
        els['zoom-in'].onclick = () => setZoom(state.zoom + .25);
        els['timeline-scroll'].onwheel = event => {
            if (!event.ctrlKey && !event.metaKey) return;
            event.preventDefault();
            setZoom(state.zoom + (event.deltaY < 0 ? .25 : -.25));
        };
        els['theme-toggle'].onclick = () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
        let storedTheme = null;
        try { storedTheme = localStorage.getItem('renderdoc-perf-theme'); } catch (_) {}
        setTheme(storedTheme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
        buildTabs();
        buildWidthMetrics();
        els.sort.value = state.sort;
        render();
    </script>
</body>
</html>
